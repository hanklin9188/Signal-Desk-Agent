name: Validate SignalDesk

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-validation:
    name: Python, schemas, safety benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and validators
        run: python -m pip install -e '.[dev]'

      - name: Validate JSON and YAML
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("[json]", path)
          for path in Path(".").rglob("*.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print("[yaml]", path)
          PY

      - name: Reject common secret files
        shell: bash
        run: |
          set -euo pipefail
          test ! -f credentials.json
          test ! -f token.json
          test ! -f .env
          if find . -type f \( -name '*.pfx' -o -name '*.p12' -o -name '*.db' -o -name '*.db-wal' \) | grep -q .; then
            echo 'Private credential or database artifact found in repository.' >&2
            exit 1
          fi

      - name: Lint
        run: ruff check signaldesk tests

      - name: Test
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q signaldesk

      - name: Locked fictional scenario benchmark
        run: signaldesk-benchmark --output runs/ci

  native-build:
    name: Native WinUI build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build native WinUI shell
        shell: pwsh
        run: dotnet build native/SignalDesk.Shell/SignalDesk.Shell.csproj -c Release -p:Platform=x64
