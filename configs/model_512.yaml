model:
  id: Qwen/Qwen3.5-4B
  revision: pin-before-release
  mode: multimodal
  enable_thinking: false

context:
  route: text
  total_tokens: 512
  max_input_tokens: 384
  max_output_tokens: 128

vision:
  enabled: true
  max_images_per_realtime_request: 1
  max_original_bytes: 20000000
  max_model_input_bytes: 8000000
  target_long_edge_pixels: 1280
  max_context_tokens: 4096
  max_output_tokens: 256
  ocr_model_id: PaddlePaddle/PaddleOCR-VL-1.6
  ocr_model_revision: pin-before-release
  ocr_residency: on_demand

generation:
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  stop_on_valid_json: true

runtime:
  backend: transformers
  residency: always_on
  idle_unload_minutes: 30
  queue_batch_window_seconds: 20
  health_timeout_seconds: 10

privacy:
  external_inference: false
