<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">SignalDesk agent decision loop</title>
  <desc id="desc">Messages are normalized, understood with evidence, evaluated by policy, turned into bounded actions, and improved by local user feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6d6af8"/>
      <stop offset="1" stop-color="#45c8f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02040c" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#65718f"/>
    </marker>
  </defs>
  <rect width="1440" height="700" rx="30" fill="url(#bg)"/>
  <circle cx="1320" cy="90" r="220" fill="#6d6af8" opacity=".07"/>
  <circle cx="90" cy="650" r="250" fill="#45c8f5" opacity=".05"/>

  <text x="72" y="76" fill="#f7f9ff" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700">A bounded loop — not an open-ended chatbot</text>
  <text x="72" y="111" fill="#9ca9c7" font-family="Inter,Segoe UI,sans-serif" font-size="17">Every recommendation keeps its evidence, passes validation, and stays under user control.</text>

  <path d="M310 286H354M610 286H654M910 286H954" stroke="#65718f" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="66" y="181" width="244" height="210" rx="24" fill="#151f35" stroke="#293957" stroke-width="2"/>
    <rect x="66" y="181" width="8" height="210" rx="4" fill="#45c8f5"/>
    <circle cx="116" cy="231" r="24" fill="#163a4b"/>
    <text x="116" y="239" text-anchor="middle" fill="#55d5ff" font-family="Segoe UI Symbol,Segoe UI,sans-serif" font-size="25">↓</text>
    <text x="102" y="290" fill="#f7f9ff" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="700">1 · Observe</text>
    <text x="102" y="329" fill="#a8b3cc" font-family="Inter,Segoe UI,sans-serif" font-size="16">Normalize sources</text>
    <text x="102" y="356" fill="#a8b3cc" font-family="Inter,Segoe UI,sans-serif" font-size="16">Deduplicate replays</text>

    <rect x="366" y="181" width="244" height="210" rx="24" fill="#151f35" stroke="#293957" stroke-width="2"/>
    <rect x="366" y="181" width="8" height="210" rx="4" fill="#7b74ff"/>
    <circle cx="416" cy="231" r="24" fill="#2b285c"/>
    <text x="416" y="239" text-anchor="middle" fill="#a49fff" font-family="Segoe UI Symbol,Segoe UI,sans-serif" font-size="22">◇</text>
    <text x="402" y="290" fill="#f7f9ff" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="700">2 · Understand</text>
    <text x="402" y="329" fill="#a8b3cc" font-family="Inter,Segoe UI,sans-serif" font-size="16">Group conversations</text>
    <text x="402" y="356" fill="#a8b3cc" font-family="Inter,Segoe UI,sans-serif" font-size="16">Extract evidence</text>

    <rect x="666" y="181" width="244" height="210" rx="24" fill="#151f35" stroke="#293957" stroke-width="2"/>
    <rect x="666" y="181" width="8" height="210" rx="4" fill="#9c6cf5"/>
    <circle cx="716" cy="231" r="24" fill="#352355"/>
    <text x="716" y="239" text-anchor="middle" fill="#c6a0ff" font-family="Segoe UI Symbol,Segoe UI,sans-serif" font-size="22">✓</text>
    <text x="702" y="290" fill="#f7f9ff" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="700">3 · Decide</text>
    <text x="702" y="329" fill="#a8b3cc" font-family="Inter,Segoe UI,sans-serif" font-size="16">Validate output</text>
    <text x="702" y="356" fill="#a8b3cc" font-family="Inter,Segoe UI,sans-serif" font-size="16">Apply attention policy</text>

    <rect x="966" y="181" width="408" height="210" rx="24" fill="#151f35" stroke="#3b4471" stroke-width="2"/>
    <rect x="966" y="181" width="8" height="210" rx="4" fill="url(#accent)"/>
    <circle cx="1016" cy="231" r="24" fill="#173c4d"/>
    <text x="1016" y="239" text-anchor="middle" fill="#65dcff" font-family="Segoe UI Symbol,Segoe UI,sans-serif" font-size="22">→</text>
    <text x="1002" y="290" fill="#f7f9ff" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="700">4 · Assist</text>
    <text x="1002" y="329" fill="#a8b3cc" font-family="Inter,Segoe UI,sans-serif" font-size="16">Surface, snooze, remind, or draft</text>
    <text x="1002" y="356" fill="#55d5ff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="600">Never auto-send</text>
  </g>

  <path d="M1170 391V438C1170 467 1147 490 1118 490H260C231 490 208 467 208 438V402" fill="none" stroke="#7b74ff" stroke-width="3" stroke-dasharray="8 9" marker-end="url(#arrow)"/>
  <rect x="420" y="446" width="540" height="82" rx="20" fill="#1a2140" stroke="#494e8a"/>
  <text x="690" y="480" text-anchor="middle" fill="#c4c0ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">LOCAL FEEDBACK LOOP</text>
  <text x="690" y="508" text-anchor="middle" fill="#a8b3cc" font-family="Inter,Segoe UI,sans-serif" font-size="16">Done, snoozed, muted, corrected — preferences improve without uploading message text.</text>

  <g>
    <rect x="66" y="587" width="1308" height="58" rx="17" fill="#11192c" stroke="#283651"/>
    <rect x="89" y="605" width="110" height="24" rx="12" fill="#28305c"/>
    <text x="144" y="622" text-anchor="middle" fill="#b8b4ff" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">SAFETY RAIL</text>
    <text x="224" y="623" fill="#b8c2d9" font-family="Inter,Segoe UI,sans-serif" font-size="15">Deterministic fallback</text>
    <circle cx="408" cy="616" r="3" fill="#4a5875"/>
    <text x="432" y="623" fill="#b8c2d9" font-family="Inter,Segoe UI,sans-serif" font-size="15">Evidence spans</text>
    <circle cx="578" cy="616" r="3" fill="#4a5875"/>
    <text x="602" y="623" fill="#b8c2d9" font-family="Inter,Segoe UI,sans-serif" font-size="15">Schema validation</text>
    <circle cx="765" cy="616" r="3" fill="#4a5875"/>
    <text x="789" y="623" fill="#b8c2d9" font-family="Inter,Segoe UI,sans-serif" font-size="15">Interruption budget</text>
    <circle cx="984" cy="616" r="3" fill="#4a5875"/>
    <text x="1008" y="623" fill="#b8c2d9" font-family="Inter,Segoe UI,sans-serif" font-size="15">Explicit user control</text>
  </g>
</svg>
